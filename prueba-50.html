<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Compra de prueba de $50 (privado)</title>
<style>
  body{font:17px/1.6 system-ui,sans-serif;max-width:34rem;margin:2rem auto;padding:0 1rem;color:#1F3454;background:#F6F1E7}
  label{display:block;margin-top:1rem;font-weight:600}
  input{font:inherit;padding:.55rem .7rem;width:100%;box-sizing:border-box;border:1px solid #4F6480;border-radius:8px;background:#fff}
  button{font:inherit;margin-top:1.4rem;padding:.7rem 1.2rem;border:0;border-radius:999px;background:#C8D6BD;color:#2F4A6B;font-weight:600;cursor:pointer}
  button[disabled]{opacity:.5}
  .ok{color:#2a6b3a}.err{color:#a33}
</style>
</head>
<body>
<h1>Compra de prueba de $50</h1>
<p>Página privada para la prueba final de Transbank. Cobra $50 de verdad, con una tarjeta real, y no usa cupos de la sesión.</p>
<p id="res" hidden></p>
<form id="f">
  <label for="tok">Token de administración</label>
  <input id="tok" type="password" autocomplete="off" required>
  <label for="nom">Nombre</label>
  <input id="nom" autocomplete="name" required>
  <label for="mail">Correo</label>
  <input id="mail" type="email" autocomplete="email" required>
  <button id="go" type="submit">Pagar $50</button>
  <p id="msg" class="err"></p>
</form>
<script>
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search).get('pago');
if (q) {
  const t = { ok: 'Pago de $50 aprobado. Revisa tu correo: debe llegar la confirmación.', cancelado: 'Cancelaste el pago. No se cobró nada.', rechazado: 'El pago fue rechazado. No se cobró nada.', error: 'Hubo un error. Si te cobraron, avisa a Transbank.' }[q] || 'Resultado: ' + q;
  $('res').textContent = t; $('res').className = q === 'ok' ? 'ok' : 'err'; $('res').hidden = false;
}
$('f').addEventListener('submit', async (e) => {
  e.preventDefault(); $('go').disabled = true; $('msg').textContent = '';
  try {
    const r = await fetch('/api/sesion/prueba50', { method: 'POST', headers: { authorization: 'Bearer ' + $('tok').value, 'content-type': 'application/json' }, body: JSON.stringify({ nombre: $('nom').value, email: $('mail').value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { $('msg').textContent = r.status === 401 ? 'Token incorrecto.' : 'No se pudo iniciar el pago (' + (j.error || r.status) + ').'; $('go').disabled = false; return; }
    const f = document.createElement('form'); f.method = 'POST'; f.action = j.url;
    const i = document.createElement('input'); i.type = 'hidden'; i.name = 'token_ws'; i.value = j.token; f.appendChild(i);
    document.body.appendChild(f); f.submit();
  } catch { $('msg').textContent = 'Sin conexión. Intenta de nuevo.'; $('go').disabled = false; }
});
</script>
</body>
</html>
